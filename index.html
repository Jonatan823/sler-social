<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.L.E.R. Social</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .hidden {
      display: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    #app-container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .view {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .app-header, .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #eaeaea;
      margin-bottom: 16px;
    }

    .contacts-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .contact-item:hover {
      background-color: #f8f9fa;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: #007bff;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-name {
      font-weight: 600;
    }

    .contact-status {
      font-size: 12px;
      color: #6c757d;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      word-break: break-word;
    }

    .message-bubble.outgoing {
      background-color: #dcf8c6;
      align-self: flex-end;
    }

    .message-bubble.incoming {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
    }

    .composer-panel {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff;
      padding-top: 8px;
    }

    textarea {
      width: 100%;
      height: 70px;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      resize: none;
      box-sizing: border-box;
    }

    .composer-actions, .send-options {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary { background-color: #007bff; color: white; flex: 1; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-success { background-color: #28a745; color: white; flex: 1; }
    .btn-accent { background-color: #17a2b8; color: white; flex: 1; }
    .btn-icon { background: none; border: none; color: #007bff; font-weight: bold; cursor: pointer; font-size: 16px; }

    .preview-container {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }

    .preview-label {
      font-size: 12px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 4px;
      display: block;
    }

    .preview-box {
      background: #ffffff;
      border: 1px dashed #adb5bd;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      min-height: 30px;
    }

    /* Pantalla de Login inicial */
    #login-view {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Vista de Inicio de Sesión -->
    <div id="login-view" class="view">
      <h2>S.L.E.R. Social</h2>
      <p style="color: #6c757d; margin-bottom: 20px;">Inicia sesión para interactuar con tus contactos</p>
      <button id="login-btn" class="btn-primary" style="padding: 12px 24px; font-size: 16px;">🔑 Ingresar con Google</button>
    </div>

    <!-- Vista 1: Lista de Contactos (Oculta por defecto hasta loguearse) -->
    <div id="contacts-view" class="view hidden">
      <header class="app-header">
        <span id="user-greeting">Hola, usuario</span>
        <button id="logout-btn" class="btn-secondary">Cerrar Sesión</button>
      </header>
      <main class="contacts-main">
        <h2>Contactos S.L.E.R.</h2>
        <p class="subtitle" style="color: #6c757d; font-size: 14px;">Selecciona un contacto para interactuar:</p>
        <ul id="contacts-list" class="contacts-list">
          <li class="contact-item" data-contact-id="1" data-contact-name="Amigo de Prueba 1">
            <div class="avatar">A1</div>
            <div class="contact-info">
              <span class="contact-name">Amigo de Prueba 1</span>
              <span class="contact-status">Disponible para S.L.E.R.</span>
            </div>
          </li>
          <li class="contact-item" data-contact-id="2" data-contact-name="Amigo de Prueba 2">
            <div class="avatar">A2</div>
            <div class="contact-info">
              <span class="contact-name">Amigo de Prueba 2</span>
              <span class="contact-status">Disponible para S.L.E.R.</span>
            </div>
          </li>
        </ul>
      </main>
    </div>

    <!-- Vista 2: Chat Activo y Envío Filtrado (Oculta por defecto) -->
    <div id="chat-view" class="view hidden">
      <header class="chat-header">
        <button id="back-to-contacts" class="btn-icon">← Volver</button>
        <span id="active-chat-name" style="font-weight: 600;">Chat</span>
        <span></span> <!-- Espaciador -->
      </header>
      
      <main class="chat-main" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <!-- Contenedor del chat volátil -->
        <div id="messages-container" class="messages-container">
          <!-- Mensajes dinámicos -->
        </div>

        <!-- Panel de composición y filtrado -->
        <div class="composer-panel">
          <textarea id="message-input" placeholder="Escribe tu mensaje o usa el micrófono..."></textarea>
          
          <div class="composer-actions">
            <button id="mic-btn" class="btn-secondary" title="Dictado por voz">🎙️ Dictar</button>
            <button id="process-preview-btn" class="btn-primary">Procesar con IA</button>
          </div>

          <!-- Vista previa estricta del mensaje purificado y formateado (No editable) -->
          <div id="preview-container" class="preview-container hidden">
            <span class="preview-label">Mensaje purificado (S.L.E.R.):</span>
            <div id="preview-text-box" class="preview-box"></div>
            
            <div class="send-options">
              <button id="send-text-btn" class="btn-success">Enviar Texto</button>
              <button id="send-voice-btn" class="btn-accent">Voz Artificial</button>
            </div>
          </div>
        </div>
      </main>
    </div>

  </div>

  <!-- Firebase SDKs y la lógica de la aplicación -->
  <script type="module" src="app.js"></script>
</body>
</html>
