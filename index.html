<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.L.E.R. Social</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea, input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #00796b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        #resultado { white-space: pre-wrap; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="container">
        <h2>S.L.E.R. Social</h2>
        
        <!-- Sección de Autenticación -->
        <div id="auth-section">
            <p>Inicia sesión para interactuar:</p>
            <button id="btn-login-google">🔑 Ingresar con Google</button>
        </div>

        <!-- Sección Principal (Oculta hasta loguearse) -->
        <div id="app-section" class="hidden">
            <p id="user-info"></p>
            <button id="btn-logout" style="background: #d32f2f;">Cerrar Sesión</button>
            
            <textarea id="texto-input" rows="3" placeholder="Escribe tu mensaje..."></textarea>
            <button id="btn-procesar">🔄 Enviar y Aplicar S.L.E.R.</button>
            
            <div id="resultado"></div>
        </div>
    </div>

    <!-- Scripts de Firebase y Lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
